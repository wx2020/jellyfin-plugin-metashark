name: "🏗️ Build Plugin"

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        id: dotnet
        with:
          dotnet-version: 9.0.x
      - name: Change default dotnet version
        run: |
          echo '{"sdk":{"version": "${{ steps.dotnet.outputs.dotnet-version }}"}}' > ./global.json
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test (offline deterministic suites only; live Douban/TMDB live-API tests are excluded as they require external sites)
        run: dotnet test --no-restore --verbosity normal --filter "FullyQualifiedName~StrmProbeTests|FullyQualifiedName~StrmDirectRedirectTests|FullyQualifiedName~MediaInfoProbeCacheTests|FullyQualifiedName~PlaybackMetadataShortCircuitTests|FullyQualifiedName~VirtualSeasonFallbackTests|FullyQualifiedName~StringSimilarityTest|FullyQualifiedName~DoubanApiCookieParsingTest|FullyQualifiedName~ParseNameTest|FullyQualifiedName~MoviePilotTests"
